<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OdinShip.com — Private Admin</title><meta name="robots" content="noindex,nofollow,noarchive">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,rgba(37,112,255,.22),transparent 30%),radial-gradient(circle at 85% 35%,rgba(72,160,255,.12),transparent 32%),linear-gradient(145deg,#020817,#061329 52%,#030914);color:#f4f8ff}.card{width:min(560px,100%);padding:34px 28px;border-radius:24px;background:rgba(5,16,35,.78);border:1px solid rgba(108,170,255,.28);box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 50px rgba(37,112,255,.08);text-align:center;backdrop-filter:blur(18px)}.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#9bc9ff;opacity:.82}h1{margin:10px 0 8px;font-size:clamp(30px,7vw,46px);background:linear-gradient(100deg,#fff 10%,#9bc9ff 48%,#fff 78%);-webkit-background-clip:text;background-clip:text;color:transparent}.domain{opacity:.72;margin-bottom:26px}.input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid rgba(155,201,255,.22);background:rgba(255,255,255,.055);color:#fff;outline:none;font-size:16px}.input:focus{border-color:rgba(108,170,255,.65);box-shadow:0 0 0 3px rgba(37,112,255,.12)}button{border:1px solid rgba(108,170,255,.4);background:linear-gradient(135deg,rgba(37,112,255,.28),rgba(72,160,255,.12));color:#fff;padding:12px 22px;border-radius:999px;cursor:pointer;font-weight:750}#login button{margin-top:14px;width:100%}.error{min-height:18px;margin-top:10px;color:#ff9eaa;font-size:12px}#dashboard{display:none}.count{font-size:clamp(58px,14vw,92px);font-weight:850;line-height:1;letter-spacing:-.05em;margin:22px 0 10px;background:linear-gradient(100deg,#fff,#9bc9ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.label{font-size:14px;opacity:.62}.status{margin-top:18px;font-size:12px;opacity:.52}#dashboard button{margin-top:0}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.reset{border-color:rgba(255,190,80,.38);background:linear-gradient(135deg,rgba(255,177,65,.16),rgba(255,255,255,.06))}.logout{border-color:rgba(155,201,255,.25)}
</style></head><body><main class="card">
<section id="login"><div class="eyebrow">Private Admin</div><h1>Visitor Counter</h1><div class="domain">OdinShip.com</div><input id="password" class="input" type="password" placeholder="Enter admin password" autocomplete="current-password"><button onclick="login()">Login</button><div id="error" class="error"></div></section>
<section id="dashboard"><div class="eyebrow">Private Admin</div><h1>Visitor Counter</h1><div class="domain">OdinShip.com</div><div id="count" class="count">—</div><div class="label">Total recorded visitors</div><div id="status" class="status">Loading…</div><div class="actions"><button onclick="loadCount()">Refresh</button><button class="reset" onclick="resetCount()">Reset Visitors</button><button class="logout" onclick="logout()">Logout</button></div></section>
</main><script>
const PASSWORD='Admin@2026!';
const ENDPOINT='https://abacus.jasoncameron.dev/get/public/odinship-com-total-visitors';
const BASELINE_KEY='visitor_baseline_odinship-com-total-visitors';
function login(){if(document.getElementById('password').value===PASSWORD){sessionStorage.setItem('odin_admin','1');showDashboard();}else document.getElementById('error').textContent='Incorrect password.';}
function showDashboard(){document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';loadCount();}
function logout(){sessionStorage.removeItem('odin_admin');location.reload();}
async function getCurrent(){const r=await fetch(ENDPOINT,{cache:'no-store'});if(!r.ok)throw new Error();const t=await r.text();let n=NaN;try{const d=JSON.parse(t);n=typeof d==='number'?d:(d&&typeof d.value==='number'?d.value:Number(d?.value))}catch{}if(!Number.isFinite(n)){const m=t.match(/\b\d[\d,]*\b/);n=m?Number(m[0].replace(/,/g,'')):NaN}return n;}
async function loadCount(){const status=document.getElementById('status');status.textContent='Loading…';try{const current=await getCurrent();if(!Number.isFinite(current))throw new Error();let baseline=Number(localStorage.getItem(BASELINE_KEY)||'0');if(!Number.isFinite(baseline)||baseline<0)baseline=0;document.getElementById('count').textContent=Math.max(0,current-baseline).toLocaleString();status.textContent='Updated just now';}catch(e){status.textContent='Unable to load counter right now.';}}
async function resetCount(){if(!confirm('Reset the displayed visitor total to 0? New visitors after this reset will continue counting.'))return;const status=document.getElementById('status');try{const current=await getCurrent();if(!Number.isFinite(current))throw new Error();localStorage.setItem(BASELINE_KEY,String(current));document.getElementById('count').textContent='0';status.textContent='Counter reset on this admin browser';}catch(e){status.textContent='Reset failed. Try again.';}}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
if(sessionStorage.getItem('odin_admin')==='1')showDashboard();
</script></body></html>
